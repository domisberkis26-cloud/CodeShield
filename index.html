
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click the Target</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111827;
      color: white;
    }

    h1 { color: #38bdf8; }

    #arena {
      width: 90%;
      max-width: 500px;
      height: 350px;
      margin: 20px auto;
      background: #1f2937;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    #target {
      width: 50px;
      height: 50px;
      border: 0;
      border-radius: 50%;
      background: #f43f5e;
      position: absolute;
      display: none;
      cursor: pointer;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #38bdf8;
      color: #111827;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🎯 Click the Target</h1>
  <p>Score: <span id="score">0</span></p>
  <p>Time: <span id="time">20</span> seconds</p>

  <button id="start">Start Game</button>

  <div id="arena">
    <button id="target" aria-label="Click target"></button>
  </div>

  <h2 id="message">Ready to play?</h2>

  <script>
    const arena = document.getElementById("arena");
    const target = document.getElementById("target");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const message = document.getElementById("message");
    const start = document.getElementById("start");

    let score = 0;
    let time = 20;
    let timer;
    let playing = false;

    function moveTarget() {
      const maxX = arena.clientWidth - target.offsetWidth;
      const maxY = arena.clientHeight - target.offsetHeight;

      target.style.left = Math.random() * maxX + "px";
      target.style.top = Math.random() * maxY + "px";
    }

    start.addEventListener("click", () => {
      clearInterval(timer);

      score = 0;
      time = 20;
      playing = true;

      scoreText.textContent = score;
      timeText.textContent = time;
      message.textContent = "Go! Click the target!";
      start.disabled = true;
      target.style.display = "block";
      moveTarget();

      timer = setInterval(() => {
        time--;
        timeText.textContent = time;

        if (time <= 0) {
          clearInterval(timer);
          playing = false;
          target.style.display = "none";
          message.textContent = "Game over! Final score: " + score;
          start.disabled = false;
          start.textContent = "Play Again";
        }
      }, 1000);
    });

    target.addEventListener("click", () => {
      if (!playing) return;

      score++;
      scoreText.textContent = score;
      moveTarget();
    });
  </script>
</body>
</html>
